apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-2
  # labels related to deployment resource
  labels:
    app: app-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-2
  #pod
  template:
    metadata:
      labels:
        app: app-2
    spec:
      containers:
      - name: app2
        image: joindevops/app2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadate: 
  name: app-2
  labels: 
    app: app-2
spec: 
  selector:
    app: app-2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-2
  annotations: 
    alb.ingress.kuberneres.io/scheme: interner-facing
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn:  
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: Environment=dev,Team=test
    alb.ingress.kubernetes.io/group.name: roboshop
spec:
  ingressClassName: alb
  rules:
  - host: "app2.daws90s.shop"
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: app-2
            port:
              number: 80
